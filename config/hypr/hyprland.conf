# ------------------------------------------------------------------------------
# Modular Configuration Sourcing Hierarchy (6-Layer Decoupled Architecture)
# ------------------------------------------------------------------------------

# Layer 1: Compatibility (Displays & Hardware)
source = ./monitors.conf
# Hardware specific config (uncommented by installer if NVIDIA GPU detected)
# source = ./nvidia.conf

# Layer 2: Environment
source = ./env.conf

# Layer 3: Theme (Material You Dynamic Palette)
source = ./colors.conf

# Layer 4: UI Styling (Aesthetics & Physics Animations)
source = ./decorations.conf
source = ./animations.conf

# Layer 5: Core Window Management & Operational Logic
source = ./rules.conf
source = ./keybinds.conf

# Layer 6: Services, Background Daemons & Supervisor
source = ./autostart.conf

# Layer 7: User Overrides & JaKooLit UserConfigs
# source = ./UserConfigs/Startup_Apps.conf
# source = ./UserConfigs/UserKeybinds.conf
# source = ./UserConfigs/UserSettings.conf
# source = ./UserConfigs/WorkSpaceRules.conf

# ------------------------------------------------------------------------------
# Global Variables & Input Configuration
# ------------------------------------------------------------------------------
$mainMod = SUPER

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    repeat_rate = 50
    repeat_delay = 300
    numlock_by_default = true

    follow_mouse = 1
    float_switch_override_focus = false
    sensitivity = 0 # -1.0 to 1.0, 0 means no modification.

    touchpad {
        disable_while_typing = true
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
    }

    touchdevice {
        enabled = true
    }
}

# ------------------------------------------------------------------------------
# Touchpad & Touchscreen Gestures (Hyprland 0.50+ Syntax)
# ------------------------------------------------------------------------------
gestures {
    gesture = 3, horizontal, workspace
    workspace_swipe_distance = 500
    workspace_swipe_invert = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new = true
    workspace_swipe_forever = true
}

# ------------------------------------------------------------------------------
# Layout Engines (Dwindle & Master)
# ------------------------------------------------------------------------------
general {
    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
}

dwindle {
    preserve_split = true
    smart_split = false
    smart_resizing = true
    special_scale_factor = 0.8
}

master {
    new_status = master
    new_on_top = 1
    mfact = 0.5
}

# ------------------------------------------------------------------------------
# Compositor Binds & Session Behaviors
# ------------------------------------------------------------------------------
binds {
    workspace_back_and_forth = true
    allow_workspace_cycles = true
    pass_mouse_when_bound = false
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    focus_on_activate = false
    initial_workspace_tracking = 0
    middle_click_paste = false
    enable_anr_dialog = true
    anr_missed_pings = 15
    allow_session_lock_restore = true
    on_focus_under_fullscreen = 1
}

# ------------------------------------------------------------------------------
# XWayland & Rendering Quality
# ------------------------------------------------------------------------------
xwayland {
    enabled = true
    force_zero_scaling = true
}

render {
    direct_scanout = 0
}

cursor {
    no_hardware_cursors = 1
    enable_hyprcursor = true
    sync_gsettings_theme = true
    warp_on_change_workspace = 2
    no_warps = true
}

# ------------------------------------------------------------------------------
# Layer 8: User Preferences & Overrides (Guaranteed Never Overwritten)
# ------------------------------------------------------------------------------
source = ~/.config/hypr/userprefs.conf

