# ==============================================================================
# yusei-hypr: Application Style & Qt6 QML Theming (application-style.conf)
# Architecture: hyprland-qt-support QML Style Integration for hypr* Qt6 Apps
# Reference: https://wiki.hyprland.org/Configuring/Variables/#misc
