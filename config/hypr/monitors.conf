# ==============================================================================
# Universal Dynamic Monitor Configuration (Hardware Independent)
# ==============================================================================
# Automatically adapts to any monitor connected (Laptop or Desktop)
# without requiring hardcoded hardware IDs (e.g. eDP-1, DP-1, HDMI-A-1).
# Reference: https://wiki.hyprland.org/Configuring/Monitors/
# Syntax: monitor = [name], [resolution@refresh], [position], [scale]
# ==============================================================================

# Universal Default Rule:
# Automatically configures ANY connected display (laptop internal panel or external display)
# at its native preferred resolution, automatic side-by-side positioning, and 1.0x scale.
monitor = , preferred, auto, 1

# High Refresh Rate Preference (Uncomment if preferred for gaming monitors):
# monitor = , highrr, auto, 1

# High Resolution Preference (Uncomment if preferred for HiDPI/4K monitors):
# monitor = , highres, auto, 1

# ------------------------------------------------------------------------------
# Dynamic Laptop Lid Switch Handling (No Hardcoded Connector Names)
# ------------------------------------------------------------------------------
# When an external monitor is connected and laptop lid is closed:
# Disables the laptop internal display dynamically by detecting the internal eDP interface.
# When lid is opened: re-enables the internal display automatically.
#
# bindl = , switch:on:Lid Switch, exec, hyprctl monitors -j | jq -r '.[].name' | grep -v -E '^eDP' | grep -q . && hyprctl keyword monitor "$(hyprctl monitors -j | jq -r '.[].name' | grep -E '^eDP'), disable"
# bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "$(hyprctl monitors -j | jq -r '.[].name' | grep -E '^eDP'), preferred, auto, 1"

# ------------------------------------------------------------------------------
# Manual Display Profiles & Tuning Examples (For Custom Multi-Monitor Setups)
# ------------------------------------------------------------------------------
# Laptop 1080p 60Hz:
# monitor = eDP-1, 1920x1080@60, 0x0, 1

# External 2K 144Hz placed to the right of laptop:
# monitor = DP-1, 2560x1440@144, 1920x0, 1

# HiDPI 4K Display with 1.5x fractional scaling:
# monitor = HDMI-A-1, 3840x2160@60, auto, 1.5

# Display Mirroring (Duplicate primary display to projector / secondary screen):
# monitor = , preferred, auto, 1, mirror, eDP-1

# Display Orientation (Vertical / Portrait mode):
# monitor = DP-2, preferred, auto, 1, transform, 1

# Ultra-Wide Curved Display (21:9 / 32:9):
# monitor = DP-1, 3440x1440@144, 0x0, 1

# Variable Refresh Rate (VRR / FreeSync / G-Sync) Example:
# In ~/.config/hypr/userprefs.conf, add:
# misc {
#     vrr = 1  # 0 = off, 1 = on, 2 = fullscreen games only
# }

# Virtual Machines (QEMU / KVM / VirtualBox / VMware):
# monitor = Virtual-1, 1920x1080@60, auto, 1

