# ==============================================================================
# Autostart Daemons & Background Services (Modular Compatibility Layer)
# ==============================================================================
# Preserves the full operational backbone of JaKooLit Arch-Hyprland while
# integrating the End-4 Material 3 singleton daemon supervisor.
# ==============================================================================

$scriptsDir = $HOME/.config/hypr/scripts

# ------------------------------------------------------------------------------
# 1. D-Bus & Systemd User Session Environment Imports
# ------------------------------------------------------------------------------
# Critical: Exports Wayland session identifiers to systemd and D-Bus activation
# environments, preventing desktop portal hang-ups and screen share failures.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE

# ------------------------------------------------------------------------------
# 2. Polkit Authentication Agent
# ------------------------------------------------------------------------------
# Starts the first available Polkit agent via fallback inspection script
exec-once = $scriptsDir/Polkit.sh

# ------------------------------------------------------------------------------
# 3. Desktop Portal Initialization
# ------------------------------------------------------------------------------
# Cleanly restarts xdg-desktop-portal-hyprland and xdg-desktop-portal
exec-once = $scriptsDir/PortalHyprland.sh

# ------------------------------------------------------------------------------
# 4. Input Method (Fcitx5)
# ------------------------------------------------------------------------------
# Vietnamese / CJK input daemon with replacement guard
exec-once = fcitx5 -d --replace

# ------------------------------------------------------------------------------
# 5. Clipboard History Daemon (Cliphist)
# ------------------------------------------------------------------------------
# Captures both text and image buffers into cliphist sqlite store
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ------------------------------------------------------------------------------
# 6. Hardware & Network Tray Applets
# ------------------------------------------------------------------------------
exec-once = nm-applet --indicator
exec-once = blueman-applet

# ------------------------------------------------------------------------------
# 7. Singleton Desktop UI Daemon Supervisor
# ------------------------------------------------------------------------------
# Guarantees singletons for Waybar, SwayNC, swww-daemon, and Hypridle
# while eliminating conflicting daemons (dunst, mako, eww, ags).
exec-once = $scriptsDir/launch-daemons.sh

# ------------------------------------------------------------------------------
# 8. Operational Utilities & Workflow Helpers
# ------------------------------------------------------------------------------
# Initialize global J/K window cycling
exec-once = $scriptsDir/KeybindsLayoutInit.sh

# Initialize animated dropdown scratchpad terminal
exec-once = $scriptsDir/Dropterminal.sh kitty &

# Night light daemon init (Hyprsunset)
exec-once = $scriptsDir/Hyprsunset.sh init
