# ==============================================================================
# Universal Wayland Environment Variables
# ==============================================================================
# Standardized environment configuration ensuring seamless compatibility across
# Qt, GTK, Electron, Wayland desktop portals, CJK/Vietnamese input, and cursors.
# Reference: https://wiki.hyprland.org/Configuring/Environment-variables/
# ==============================================================================

# Dotfiles Version
env = DOTS_VERSION,1.5.0

# ------------------------------------------------------------------------------
# XDG Desktop & Session Specifications
# ------------------------------------------------------------------------------
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ------------------------------------------------------------------------------
# Toolkit Backends
# ------------------------------------------------------------------------------
# Prioritize native Wayland backend, fallback to X11 via XWayland if unsupported
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = CLUTTER_BACKEND,wayland

# Note on SDL: Certain legacy SDL2 games crash if forced to Wayland.
# Keep commented or set to 'wayland,x11' for optimal game compatibility.
# env = SDL_VIDEODRIVER,wayland

# ------------------------------------------------------------------------------
# Qt Theming, Styling & Fractional Scaling
# ------------------------------------------------------------------------------
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_QUICK_CONTROLS_STYLE,org.hyprland.style

# XWayland scaling parity
env = GDK_SCALE,1
env = QT_SCALE_FACTOR,1

# ------------------------------------------------------------------------------
# Cursor Themes & Sizing
# ------------------------------------------------------------------------------
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24

# ------------------------------------------------------------------------------
# Electron / Chromium Applications
# ------------------------------------------------------------------------------
# Auto-detects Wayland for Electron >= 28 (VS Code, Discord, Slack, Spotify)
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ------------------------------------------------------------------------------
# Firefox Wayland Acceleration
# ------------------------------------------------------------------------------
env = MOZ_ENABLE_WAYLAND,1

# ------------------------------------------------------------------------------
# Input Method (Fcitx5 / CJK / Vietnamese Telex & VNI)
# ------------------------------------------------------------------------------
env = XMODIFIERS,@im=fcitx
env = QT_IM_MODULE,fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus
# Note: GTK_IM_MODULE is intentionally omitted on modern GTK4 Wayland sessions
# to avoid crashes, relying on native Wayland text-input-v3 protocol.
# Uncomment below only if legacy GTK2/3 apps require it:
# env = GTK_IM_MODULE,fcitx
