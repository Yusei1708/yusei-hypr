# ==============================================================================
# Decorations & Styling (End-4 / Material 3 Aesthetic)
# ==============================================================================

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Material 3 soft pastel accents
    col.active_border = $primary $secondary 45deg
    col.inactive_border = rgba(44474f55)

    resize_on_border = true
    hover_icon_on_border = true
    allow_tearing = true
}

decoration {
    rounding = 16
    
    # Window Opacity
    active_opacity = 0.98
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    # Soft ambient drop shadow
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000035)
        offset = 0, 4
    }

    # Rich Dual Kawase Blur
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.01
        contrast = 0.9
        brightness = 0.85
        vibrancy = 0.2
        vibrancy_darkness = 0.2
        special = true
        popups = true
    }
}
