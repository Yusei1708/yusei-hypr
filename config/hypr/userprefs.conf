# ==============================================================================
# yusei-hypr: User Custom Preferences & Overrides (userprefs.conf)
# ==============================================================================
# This configuration file is NEVER overwritten by yusei-hypr updates or reinstallations.
# Place all your personal tweaks, custom monitors, extra keybindings, and autostart apps here.
# It is sourced at the very end of ~/.config/hypr/hyprland.conf (Layer 8) to ensure your
# settings take precedence over system defaults.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Monitors
# ------------------------------------------------------------------------------
# Configure custom monitor layout, resolutions, refresh rates, scales, and positions.
# Run 'hyprctl monitors' to view connected outputs.
# Format: monitor = name, resolution@refresh, position, scale
#
# Examples:
# monitor = DP-1, 2560x1440@144, 0x0, 1
# monitor = eDP-1, 1920x1080@60, 2560x0, 1
# monitor = HDMI-A-1, 1920x1080@60, auto, 1, mirror, DP-1
# monitor = , preferred, auto, 1


# ------------------------------------------------------------------------------
# 2. Environment Variables
# ------------------------------------------------------------------------------
# Set custom environment variables for apps, Wayland toolkits, or GPU drivers.
#
# Examples:
# env = XCURSOR_SIZE,24
# env = HYPRCURSOR_SIZE,24
# env = QT_QPA_PLATFORMTHEME,qt5ct
# env = GDK_BACKEND,wayland,x11,*
#
# NVIDIA Wayland Flags (Auto-injected by hardware-detect.sh if NVIDIA GPU is present):
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct


# ------------------------------------------------------------------------------
# 3. Autostart Applications (exec-once)
# ------------------------------------------------------------------------------
# Launch your personal background services or favorite startup applications.
#
# Examples:
# exec-once = [workspace 1 silent] kitty
# exec-once = [workspace 2 silent] google-chrome
# exec-once = discord --start-minimized
# exec-once = telegram-desktop -startintray


# ------------------------------------------------------------------------------
# 4. Custom Keybindings
# ------------------------------------------------------------------------------
# Add or override keyboard shortcuts without modifying core system keybindings.
# $mainMod is predefined as SUPER (Windows key).
#
# Examples:
# bind = $mainMod, Return, exec, kitty
# bind = $mainMod, B, exec, google-chrome
# bind = $mainMod, E, exec, thunar
# bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy
# bind = $mainMod, F1, exec, ~/.config/hypr/scripts/my-script.sh
# bind = $mainMod SHIFT, M, togglespecialworkspace, music
# bind = $mainMod SHIFT, B, togglespecialworkspace, monitor


# ------------------------------------------------------------------------------
# 5. Custom Window & Workspace Rules
# ------------------------------------------------------------------------------
# Define custom floating, opacity, pinning, or positioning rules for specific windows.
# Run 'hyprctl clients' to inspect window class and title.
#
# Examples:
# windowrulev2 = float, class:^(pavucontrol)$
# windowrulev2 = size 800 600, class:^(pavucontrol)$
# windowrulev2 = center, class:^(pavucontrol)$
# windowrulev2 = opacity 0.90 0.90, class:^(kitty)$
#
# Workspace Assignment Examples:
# windowrulev2 = workspace 2, class:^(google-chrome)$
# windowrulev2 = workspace 3, class:^(discord)$
# workspace = 1, monitor:DP-1, default:true
# workspace = special:music, on-created-empty:spotify
# workspace = special:monitor, on-created-empty:kitty -e btop


# ------------------------------------------------------------------------------
# 6. Power & Battery Management Preferences
# ------------------------------------------------------------------------------
# Configure laptop power optimization and dynamic refresh rate switching.
#
# Automatically lower display refresh rate to 60Hz when on battery:
# 1 = Enabled (default on laptop), 0 = Disabled
# env = YUSEI_AUTO_60HZ,1
#
# Preferred energy profile when connected to AC power (balanced or turbo):
# env = YUSEI_AC_PROFILE,balanced
#
# Preferred energy profile when running on battery (eco or balanced):
# env = YUSEI_BAT_PROFILE,eco
#
# Enable background power-optimizer daemon (1 = Enabled, 0 = Disabled):
# env = YUSEI_POWER_DAEMON,1


