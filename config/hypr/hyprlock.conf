# ==============================================================================
# yusei-hypr: Hyprlock Configuration (End-4 Material 3 Minimal Style)
# Architecture: Relative Palette Sourcing | 5-Second Grace CLI Integration
# Features: Dynamic Blurred Wallpaper, Material Pill Input, CapsLock Warning, Battery Label
# ==============================================================================

# Dynamic Material You color scheme tokens
source = ./colors.conf

general {
    # Note: Grace period is enforced via '--grace 5' in LockScreen.sh and hypridle.conf
    # to maintain strict compatibility across all hyprlock releases.
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.75
    vibrancy = 0.2
}

# Digital Clock (Hour & Minute)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(242, 242, 247, 0.95)
    font_size = 90
    font_family = JetBrains Mono Nerd Font Bold
    position = 0, 160
    halign = center
    valign = center
}

# Date Label
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B %Y")"
    color = rgba(168, 199, 250, 0.9)
    font_size = 20
    font_family = JetBrains Mono Nerd Font Medium
    position = 0, 70
    halign = center
    valign = center
}

# Password Input Box (Material Pill)
input-field {
    monitor =
    size = 280, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(168, 199, 250, 0.8)
    inner_color = rgba(30, 31, 36, 0.75)
    font_color = rgba(242, 242, 247, 0.95)
    fade_on_empty = false
    placeholder_text = <span foreground="##a8c7fa"><i>Enter Password...</i></span>
    hide_input = false
    rounding = 28
    check_color = rgba(211, 187, 255, 0.8)
    fail_color = rgba(242, 184, 181, 0.8)
    capslock_color = rgba(255, 180, 0, 0.8)
    fail_text = <i>Incorrect ($ATTEMPTS)</i>
    position = 0, -40
    halign = center
    valign = center
}

# Laptop Battery Status (Dynamic: only renders if BAT* exists)
label {
    monitor =
    text = cmd[update:10000] sh -c 'if compgen -G "/sys/class/power_supply/BAT*" > /dev/null 2>&1; then [ -f "$HOME/.config/hypr/scripts/Battery.sh" ] && "$HOME/.config/hypr/scripts/Battery.sh" 2>/dev/null || (for b in /sys/class/power_supply/BAT*; do [ -f "$b/capacity" ] && echo "󰁹 $(cat "$b/capacity")% ($(cat "$b/status"))" && break; done); fi'
    color = rgba(242, 242, 247, 0.75)
    font_size = 14
    font_family = JetBrains Mono Nerd Font Medium
    position = 0, -110
    halign = center
    valign = center
}
