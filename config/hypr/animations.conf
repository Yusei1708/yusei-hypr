# ==============================================================================
# Fluid Physics-Based Animations (End-4 Expressive Curves)
# ==============================================================================

animations {
    enabled = true

    # Material 3 & iOS style expressive bezier curves
    bezier = expressive, 0.05, 0.9, 0.1, 1.05
    bezier = snappy, 0.35, 0.0, 0.15, 1.0
    bezier = standard, 0.2, 0.0, 0, 1.0
    bezier = decelerated, 0.0, 0.0, 0.2, 1.0

    # Window animations
    animation = windows, 1, 4.5, expressive, popin 75%
    animation = windowsOut, 1, 3.5, snappy, popin 80%
    animation = windowsMove, 1, 4.0, expressive

    # Fade & transparency transitions
    animation = fadeIn, 1, 3.5, standard
    animation = fadeOut, 1, 3.0, snappy
    animation = fadeSwitch, 1, 3.0, standard
    animation = fadeShadow, 1, 4.0, standard
    animation = fadeDim, 1, 4.0, standard

    # Border animations
    animation = border, 1, 6, standard
    animation = borderangle, 1, 40, linear, loop

    # Workspace sliding with expressive inertia
    animation = workspaces, 1, 5.0, expressive, slide
    animation = specialWorkspace, 1, 4.5, expressive, slidevert
}
