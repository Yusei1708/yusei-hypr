# ==============================================================================
# Hypridle Configuration
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock --grace 5 -q
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = "$HOME/.config/hypr/scripts/DpmsControl.sh" --wake
}

# 1. Dim screen after 2.5 minutes
listener {
    timeout = 150
    on-timeout = "$HOME/.config/hypr/scripts/DpmsControl.sh" --dim
    on-resume = "$HOME/.config/hypr/scripts/DpmsControl.sh" --restore-brightness
}

# 2. Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off displays after 5.5 minutes
listener {
    timeout = 330
    on-timeout = "$HOME/.config/hypr/scripts/DpmsControl.sh" --off
    on-resume = "$HOME/.config/hypr/scripts/DpmsControl.sh" --on
}

# 4. Suspend system after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
